# Enable/Disable api-docs swagger-ui
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html
springdoc.api-docs.enabled=true


# Configuración de H2
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# JPA (opcional, pero recomendado)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# AWS S3 Bucket MinIO local
s3.endpoint=http://localhost:9000
s3.access-key=admin
s3.secret-key=admin12345
s3.region=us-east-1
s3.bucket=items

# Spring AI - Ollama
spring.ai.ollama.base-url=http://localhost:11434

# Chat
spring.ai.ollama.chat.options.model=llama3.1:8b
spring.ai.ollama.chat.options.temperature=0.3

# Embeddings
spring.ai.ollama.embedding.options.model=nomic-embed-text

# Usuario de solo lectura para las consultas SQL generadas por IA
ai.datasource.username=ai_readonly
ai.datasource.password=ai_readonly_2026

# Limites de seguridad para las consultas SQL generadas por IA
ai.sql.max-rows=100
ai.sql.query-timeout-seconds=5
